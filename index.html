<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Hand Gesture Recognition</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #101827; color: #f8fafc; text-align: center; padding: 24px 12px; }
    h1 { color: #38bdf8; font-size: clamp(24px, 5vw, 36px); }
    .camera { position: relative; display: inline-block; width: min(100%, 680px); overflow: hidden; border-radius: 16px; border: 3px solid #38bdf8; background: #060b14; }
    video { display: block; width: 100%; transform: scaleX(-1); }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
    button { background: #38bdf8; color: #101827; padding: 14px 24px; font-size: 18px; font-weight: bold; border: 0; border-radius: 10px; cursor: pointer; margin: 12px; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #status { color: #facc15; min-height: 24px; }
    #result { color: #4ade80; font-size: 25px; }
    .hint { color: #cbd5e1; font-size: 14px; }
  </style>
</head>
<body>
  <h1>🤖 AI Hand Gesture Recognition</h1>
  <p>Ձեռքի ժեստերի ճանաչում իրական ժամանակում</p>
  <button id="startButton">Միացնել տեսախցիկը</button>
  <p id="status">Սեղմիր կոճակը՝ տեսախցիկը միացնելու համար։ ԱԲ մոդելը բեռնվում է առանձին։</p>
  <button id="retryButton" type="button" hidden>Կրկին բեռնել ԱԲ մոդելը</button>
  <div class="camera">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>
  <h2 id="result">Ժեստ՝ դեռ չի ճանաչվել</h2>
  <p id="confidence"></p>
  <p class="hint">Օգտագործիր HTTPS հասցե (օրինակ՝ GitHub Pages) և թույլատրիր տեսախցիկի օգտագործումը։</p>

  <script type="module">
    let GestureRecognizer, FilesetResolver, DrawingUtils;

    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const resultText = document.getElementById('result');
    const confidenceText = document.getElementById('confidence');
    const statusText = document.getElementById('status');
    const startButton = document.getElementById('startButton');
    const retryButton = document.getElementById('retryButton');
    const gestureNames = {
      Thumb_Up: '👍 Բութ մատը վեր',
      Thumb_Down: '👎 Բութ մատը վար',
      Open_Palm: '🖐️ Բաց ափ',
      Closed_Fist: '✊ Փակ բռունցք',
      Victory: '✌️ Հաղթանակ',
      Pointing_Up: '☝️ Ցուցամատը վեր',
      ILoveYou: '🤟 Ես քեզ սիրում եմ',
      None: 'Չճանաչված ժեստ'
    };

    let recognizer;
    let running = false;
    let lastVideoTime = -1;
    let lastTimestamp = -1;
    let loading = false;
    const timeout = (promise, ms) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('Բեռնման ժամանակը սպառվեց (' + Math.round(ms / 1000) + ' վրկ)')), ms))]);

    async function initializeAI() {
      if (loading) return;
      loading = true;
      retryButton.hidden = true;
      statusText.textContent = '⏳ Բեռնվում է ԱԲ մոդելը։ Տեսախցիկը կարող ես միացնել արդեն հիմա։';
      try {
        // Dynamic import lets the camera work even if the CDN is blocked.
        const mod = await timeout(import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22'), 20000);
        ({ GestureRecognizer, FilesetResolver, DrawingUtils } = mod);
        const vision = await timeout(FilesetResolver.forVisionTasks(
          'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
        ), 20000);
        recognizer = await timeout(GestureRecognizer.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task',
            delegate: 'CPU'
          },
          runningMode: 'VIDEO',
          numHands: 2
        }), 45000);
        statusText.textContent = '✅ ԱԲ մոդելը պատրաստ է' + (running ? '․ ճանաչումը սկսված է։' : '․ միացրու տեսախցիկը։');
        if (running) requestAnimationFrame(predict);
      } catch (error) {
        statusText.textContent = '❌ ԱԲ մոդելը չբեռնվեց․ ' + error.message + '։ Եթե աշխատանքային ցանցում ես, հնարավոր է՝ CDN-ը կամ Google Storage-ը արգելափակված են։';
        retryButton.hidden = false;
        console.error('AI load error:', error);
      } finally {
        loading = false;
      }
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API unavailable: HTTPS required');
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        video.srcObject = stream;
        await video.play();
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        running = true;
        startButton.hidden = true;
        statusText.textContent = recognizer ? '🟢 Տեսախցիկն աշխատում է, ԱԲ ճանաչումը միացված է' : '🟢 Տեսախցիկն աշխատում է, ԱԲ մոդելը դեռ բեռնվում է';
        if (recognizer) requestAnimationFrame(predict);
      } catch (error) {
        statusText.textContent = '❌ Տեսախցիկը հասանելի չէ․ ' + error.name + ': ' + error.message;
        console.error(error);
      }
    }

    function predict() {
      if (!running) return;
      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const timestamp = Math.max(performance.now(), lastTimestamp + 1);
        lastTimestamp = timestamp;
        try {
          const results = recognizer.recognizeForVideo(video, timestamp);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          const drawingUtils = new DrawingUtils(ctx);
          for (const landmarks of (results.landmarks || [])) {
            drawingUtils.drawConnectors(landmarks, GestureRecognizer.HAND_CONNECTIONS, { color: '#22c55e', lineWidth: 3 });
            drawingUtils.drawLandmarks(landmarks, { color: '#ef4444', radius: 4 });
          }
          const gesture = results.gestures?.[0]?.[0];
          if (gesture) {
            resultText.textContent = 'Ժեստ՝ ' + (gestureNames[gesture.categoryName] || gesture.categoryName);
            confidenceText.textContent = 'Վստահության գնահատական՝ ' + (gesture.score * 100).toFixed(1) + '%';
          } else {
            resultText.textContent = 'Ձեռք չի հայտնաբերվել';
            confidenceText.textContent = '';
          }
        } catch (error) {
          statusText.textContent = '❌ Սխալ՝ ժեստերի ճանաչման ընթացքում';
          console.error(error);
          running = false;
          return;
        }
      }
      requestAnimationFrame(predict);
    }

    startButton.addEventListener('click', startCamera);
    retryButton.addEventListener('click', initializeAI);
    initializeAI();
  </script>
</body>
</html>
